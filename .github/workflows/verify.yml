name: Verify SDK
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.16.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sdk-validation
          path: |
            artifacts/packages
            coverage
            playwright-report
  original-consumers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 14.21.3
      - run: node -e "require('fs').appendFileSync(process.env.GITHUB_ENV, 'SDK_CONSUMER_NODE=' + process.execPath + '\n')"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.16.1
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:consumers
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: original-consumer-validation
          path: |
            artifacts/consumer-validation.json
            playwright-report
